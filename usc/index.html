<title>USC Brain Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single phone-width column (max 440px), USC member-app dark world, fixed tab bar. Single dark theme by choice, matching USC's app. */
:root {
  --bg: #111316;
  --surface: #1b1e22;
  --surface-2: #24282d;
  --line: #31363c;
  --fg: #eceef0;
  --muted: #9aa1a9;
  --silver: #c9ccd0;
  --sky: #5ab0e2;
  --sky-ink: #0d1a24;
  --orange: #e2894b;
  --good: #5cc48a;
  --bad: #e5645a;
  --display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --body: "Figtree", "Helvetica Neue", Arial, sans-serif;
  --r: 18px;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
#app { max-width: 440px; margin: 0 auto; min-height: 100%; padding-inline: 16px; padding-block: 12px 104px; position: relative; }
#app.no-tabs { padding-bottom: 32px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: 30px; font-weight: 800; line-height: 1.05; }
h2 { font-size: 20px; font-weight: 800; }
h3 { font-size: 16px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 12px; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.num { font-variant-numeric: tabular-nums; }

/* Wordmark */
.wm { display: flex; flex-direction: column; line-height: 1; }
.wm-u { font-family: var(--display); font-weight: 900; font-stretch: 125%; letter-spacing: 0.02em; font-size: 22px; color: var(--silver); }
.wm-sub { font-size: 8.5px; font-weight: 700; letter-spacing: 0.32em; color: var(--muted); margin-top: 4px; }
.wm-row { display: flex; align-items: center; gap: 10px; }
.wm-mark { height: 40px; width: auto; flex: none; }
.logo-full { max-width: 100%; height: auto; display: block; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding-block: 8px 20px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; background: var(--surface-2); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.chip.orange { background: color-mix(in srgb, var(--orange) 18%, transparent); color: var(--orange); }
.chip.sky { background: color-mix(in srgb, var(--sky) 18%, transparent); color: var(--sky); }

/* Buttons */
.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border-radius: 999px; font-weight: 700; font-size: 16px; background: var(--silver); color: #121417; transition: transform .12s ease, opacity .12s; }
.btn:active { transform: scale(0.98); }
.btn.sky { background: var(--sky); color: var(--sky-ink); }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: default; }
.link { color: var(--sky); font-weight: 600; font-size: 14px; }

/* Cards */
.card { background: var(--surface); border-radius: var(--r); padding: 18px; }
.daily { position: relative; overflow: hidden; background: linear-gradient(160deg, #1f2e3a 0%, var(--surface) 62%); border: 1px solid #2b3d4b; }
.daily h2 { font-size: 26px; font-stretch: 112%; }
.parts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.part { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 10px; min-width: 0; }
.part b { display: block; font-size: 13px; }
.part span { font-size: 11.5px; color: var(--muted); }
.part.done { outline: 1px solid color-mix(in srgb, var(--good) 50%, transparent); }
.big-score { font-family: var(--display); font-weight: 900; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }

/* Worlds */
.world { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 14px; padding: 14px; background: var(--surface); border-radius: var(--r); text-align: left; width: 100%; }
.world .wn { width: 52px; height: 52px; border-radius: 14px; background: var(--sky); color: var(--sky-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 900; font-size: 22px; }
.world.soon { opacity: .55; }
.world.soon .wn { background: var(--surface-2); color: var(--muted); }
.world .wt { min-width: 0; }
.world .wt h3 { font-size: 16px; }
.world .wt p { font-size: 13px; color: var(--muted); }
.stars { display: inline-flex; gap: 2px; color: var(--orange); }
.stars svg { width: 14px; height: 14px; }
.stars .off { color: var(--line); }

.phase { display: flex; flex-direction: column; gap: 8px; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lvl { aspect-ratio: 1; max-width: 100%; border-radius: 14px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; }
.lvl .ln { font-family: var(--display); font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
.lvl .stars svg { width: 10px; height: 10px; }
.lvl.tech { box-shadow: inset 0 0 0 1.5px var(--orange); }
.lvl.locked { opacity: .35; cursor: default; }
.lvl.next { background: var(--sky); color: var(--sky-ink); }
.lvl.next .stars .off { color: rgba(13,26,36,.3); }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(17,19,22,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 0 12px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--fg); }

/* Ranks */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border-radius: 999px; padding: 4px; }
.seg button { padding: 9px 0; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); }
.board { display: flex; flex-direction: column; }
.brow { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.brow .pos { font-family: var(--display); font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.brow.me { background: color-mix(in srgb, var(--sky) 12%, transparent); border-radius: 12px; border-bottom-color: transparent; padding-inline: 10px; }
.brow.me .pos { color: var(--sky); }
.brow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.brow .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; white-space: normal; }
.brow .sc { font-variant-numeric: tabular-nums; font-weight: 700; }
.note { font-size: 12.5px; color: var(--muted); }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input { height: 52px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 0 16px; font: inherit; font-size: 16px; }
.code-input { letter-spacing: 0.4em; font-variant-numeric: tabular-nums; font-weight: 700; text-align: center; }
.login-hero { padding-block: 36px 28px; display: flex; flex-direction: column; gap: 18px; }
.login-hero .wm-u { font-size: 38px; }
.login-hero .wm-sub { font-size: 11px; }
.login-hero h1 { font-size: 40px; font-stretch: 112%; }
.login-hero h1 em { font-style: normal; color: var(--orange); }

/* Game host */
.gamebar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 4px 14px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }
.gametitle { text-align: center; min-width: 0; }
.gametitle b { display: block; font-family: var(--display); font-size: 16px; }
.gametitle span { font-size: 12px; color: var(--muted); }
.hud { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hud b { color: var(--fg); }

/* Sudoku */
.sgrid { display: grid; gap: 0; background: var(--line); border: 2px solid var(--silver); border-radius: 10px; overflow: hidden; }
.scell { aspect-ratio: 1; background: var(--surface); display: grid; place-items: center; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.scell.br { border-right: 2px solid var(--silver); }
.scell.bb { border-bottom: 2px solid var(--silver); }
.scell.given { background: var(--surface-2); }
.scell.sel { background: color-mix(in srgb, var(--sky) 28%, var(--surface)); }
.scell.bad .plate { box-shadow: 0 0 0 2px var(--bad); }
.plate { width: 78%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-family: var(--display); color: #fff; box-shadow: inset 0 0 0 3px rgba(0,0,0,.18); font-variant-numeric: tabular-nums; }
.plate.dark { color: #15181b; }
.scell.given .plate { box-shadow: inset 0 0 0 3px rgba(0,0,0,.18), 0 0 0 1.5px rgba(255,255,255,.35); }
.palette { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.palette button { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; }
.palette .plate { width: 100%; font-size: 14px; }
.palette .erase { background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 700; }

/* Jigsaw */
.jwrap { position: relative; }
.jgrid { display: grid; gap: 2px; background: var(--bg); border-radius: 10px; overflow: hidden; aspect-ratio: 1; max-width: 100%; }
.jtile { background-repeat: no-repeat; position: relative; min-width: 0; transition: transform .12s; }
.jtile.sel { outline: 3px solid var(--sky); outline-offset: -3px; z-index: 1; }
.jtile.ok::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--good) 70%, transparent); }
.jpeek { display: flex; align-items: center; gap: 12px; }
.jpeek img { width: 72px; height: 72px; border-radius: 10px; }
.jcover { position: absolute; inset: 0; border-radius: 10px; overflow: hidden; display: grid; place-items: end center; }
.jcover img { position: absolute; inset: 0; width: 100%; height: 100%; }
.jcover span { position: relative; margin-bottom: 14px; }

/* Cue */
.cuestage { height: 210px; border-radius: var(--r); background: var(--surface); display: grid; place-items: center; position: relative; overflow: hidden; }
.cueword { font-family: var(--display); font-weight: 900; font-size: 52px; font-stretch: 110%; letter-spacing: 0.02em; }
.cuerule { text-align: center; font-weight: 700; font-size: 15px; padding: 10px; border-radius: 12px; background: var(--surface-2); }
.cuerule em { font-style: normal; color: var(--orange); }
.timer { position: absolute; left: 0; bottom: 0; height: 4px; background: var(--sky); }
.cuebtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cuebtns.arrows { grid-template-columns: repeat(2, 1fr); }
.cuebtn { height: 64px; border-radius: 16px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.cuebtn i { width: 22px; height: 22px; border-radius: 50%; display: block; }
.cuebtn svg { width: 28px; height: 28px; color: var(--fg); }
.flash-good { box-shadow: inset 0 0 0 3px var(--good); }
.flash-bad { box-shadow: inset 0 0 0 3px var(--bad); }
.countdown { font-family: var(--display); font-size: 72px; font-weight: 900; color: var(--silver); }

/* Circuit */
.turf { background: repeating-linear-gradient(90deg, #1d3326 0 33.33%, #203a2b 33.33% 66.66%); border-radius: var(--r); padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; border: 1px solid #2c4a37; }
.station { aspect-ratio: 1; max-width: 100%; border-radius: 16px; background: rgba(10,16,12,.55); border: 1.5px solid rgba(255,255,255,.1); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 700; text-align: center; padding: 6px; transition: background .12s, transform .12s; }
.station svg { width: 30px; height: 30px; color: var(--silver); }
.station.lit { background: var(--sky); color: var(--sky-ink); border-color: var(--sky); transform: scale(1.04); }
.station.lit svg { color: var(--sky-ink); }
.station.good { background: var(--good); color: #0e2016; }
.station.good svg { color: #0e2016; }
.station.badf { background: var(--bad); }
.station[disabled] { cursor: default; }
.lives { color: var(--bad); letter-spacing: 2px; }

/* Overlays */
.sheet { background: var(--surface); border-radius: 24px; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; }
.res-stars { display: flex; justify-content: center; gap: 10px; color: var(--orange); }
.res-stars svg { width: 44px; height: 44px; }
.res-stars .off { color: var(--line); }
.tech-card { border: 1.5px solid var(--orange); background: color-mix(in srgb, var(--orange) 8%, var(--surface)); }
.breath { width: 160px; height: 160px; margin: 8px auto; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--sky) 55%, transparent), color-mix(in srgb, var(--sky) 12%, transparent)); display: grid; place-items: center; font-weight: 700; transform: scale(.55); transition: transform 4s ease-in-out; }
.breath.in { transform: scale(1); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.credits { text-align: center; padding-block: 24px; }
.credits .mg { font-family: var(--display); font-weight: 900; font-size: 22px; letter-spacing: .04em; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--silver); color: #121417; padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; z-index: 30; }


/* Crossword */
.cwclue { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 14px; min-height: 44px; }
.cwgrid { display: grid; gap: 2px; margin: 0 auto; width: 100%; }
.cwx { aspect-ratio: 1; }
.cwc { aspect-ratio: 1; background: var(--fg); color: #15181b; border-radius: 4px; font-family: var(--display); font-weight: 800; font-size: clamp(13px, 4.5vw, 20px); position: relative; display: grid; place-items: center; min-width: 0; padding: 0; }
.cwc small { position: absolute; top: 1px; left: 3px; font-size: 9px; font-weight: 700; font-family: var(--body); color: #5d636b; }
.cwc.on { background: #cfe6f5; }
.cwc.cur { background: var(--sky); }
.cwc.bad { background: #f3b8b2; }
.kbd { display: flex; flex-direction: column; gap: 6px; }
.kbrow { display: flex; gap: 4px; justify-content: center; }
.kbrow button { flex: 1 1 0; max-width: 36px; height: 44px; border-radius: 8px; background: var(--surface-2); font-weight: 700; font-size: 15px; min-width: 0; }
.cwlist summary { cursor: pointer; font-weight: 600; color: var(--sky); }
.cwli { display: block; text-align: left; padding: 6px 0; font-size: 14px; width: 100%; }
/* Turf Tactics */
.tboard { display: grid; position: relative; aspect-ratio: 1; max-width: 100%; background: repeating-linear-gradient(90deg, #1d3326 0 14.28%, #203a2b 14.28% 28.56%); border-radius: var(--r); border: 1px solid #2c4a37; overflow: hidden; touch-action: none; }
.tcell { border: 1px solid rgba(255,255,255,.05); display: grid; place-items: center; min-width: 0; }
.tcell svg { width: 62%; height: 62%; }
.ttoken { position: absolute; display: block; pointer-events: none; }
.ttoken::after { content: ""; position: absolute; inset: 16%; border-radius: 50%; background: var(--sky); box-shadow: 0 0 0 3px rgba(90,176,226,.3); }
.dpad { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; }
.dpad button { height: 56px; border-radius: 14px; background: var(--surface); display: grid; place-items: center; }
.dpad svg { width: 26px; height: 26px; }
.dreset { font-size: 12px; font-weight: 700; color: var(--muted); }
/* Tempo */
.pads { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pad { aspect-ratio: 1; max-width: 100%; border-radius: 22px; background: color-mix(in srgb, var(--pc) 30%, var(--surface)); border: 2px solid color-mix(in srgb, var(--pc) 55%, transparent); transition: background .08s, transform .08s; touch-action: manipulation; }
.pad.lit { background: var(--pc); transform: scale(1.03); }
.pad.badf { background: var(--bad); }
.pad[disabled] { cursor: default; }
/* Reading + options */
.reader p { font-size: 16px; line-height: 1.6; max-width: 65ch; }
.opt { width: 100%; min-height: 52px; border-radius: 14px; background: var(--surface-2); text-align: left; padding: 12px 16px; font-weight: 600; }
.opt.good { background: color-mix(in srgb, var(--good) 35%, var(--surface-2)); }
.opt.bad { background: color-mix(in srgb, var(--bad) 35%, var(--surface-2)); }
/* Cue Code */
.glyph { width: 100%; height: 100%; display: block; }
.glyph line { stroke: currentColor; stroke-width: .24; stroke-linecap: round; }
.codegrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.codecard { background: var(--surface); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; min-width: 0; }
.codecard .glyph { width: 44px; height: 44px; }
.codecard.new { box-shadow: inset 0 0 0 1.5px var(--orange); }
.codeopts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.codeopts .opt { text-align: center; }
.codeopts.ws .opt { height: 84px; display: grid; place-items: center; }
.codeopts.ws .glyph { width: 52px; height: 52px; }
/* Breath Set */
.breathstage { height: 240px; border-radius: var(--r); background: var(--surface); display: grid; place-items: center; position: relative; overflow: hidden; }
.breathstage span { position: relative; font-weight: 700; text-align: center; padding: 0 16px; }
.bcircle { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--sky) 50%, transparent), color-mix(in srgb, var(--sky) 10%, transparent)); transform: scale(.45); }
.holdpad { height: 96px; border-radius: 22px; background: var(--surface-2); font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .08em; text-transform: uppercase; touch-action: none; user-select: none; -webkit-user-select: none; }
.holdpad.down { background: var(--sky); color: var(--sky-ink); }
#dg { transition: opacity .15s; }
.adbox { height: 180px; border-radius: 14px; border: 1.5px dashed var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-weight: 700; }

.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }

.welcome { padding-top: 8px; }

.block3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.block3 b { font-family: var(--display); font-size: 17px; color: var(--sky); }

.ability { display: flex; flex-direction: column; gap: 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

function seedFrom(str) { let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; } h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); return (h ^ h >>> 16) >>> 0; }

const ri = (r, n) => Math.floor(r() * n);

  { id: 1, name: 'Plate Sudoku', subject: 'Number puzzles', skill: 'Logic and pattern spotting', game: 'sudoku', why: 'Holding several rules in mind at once and testing each move against them. That is working memory and logical reasoning, the same skills you use to plan a busy day.', how: 'Fill the grid so every row, column and box holds each plate once.',

function teamStandings() {
  return TEAMS.map(t => {
    const pts = t.members.map(m => m === '__me' ? mySeason() : exampleSeason(m));
    return { name: t.name, mine: t.members.includes('__me'), members: t.members.map(m => m === '__me' ? myName() : m), score: Math.round(pts.reduce((a, b) => a + b, 0) / pts.length) };
  }).sort((a, b) => b.score - a.score);
}
function todayRank() {
  const mine = S.daily[ymd()] ? S.daily[ymd()].score : 0;
  return 1 + EXAMPLES.filter(n => exampleToday(n) > mine).length;
}

function starsRule(game, l) {
  switch (game) {
    case 'sudoku': { const n = l <= 3 ? 4 : l <= 8 ? 6 : 9, par = n === 4 ? '45 seconds' : n === 6 ? '2 minutes 30' : '8 minutes'; return `Solve the ${n}x${n} grid in under ${par} with no clashes.`; }
    case 'crossword': return 'Finish with no Reveal letter and at most one Check.';
    case 'jigsaw': return 'Finish in the best possible number of swaps, or one more.';
    case 'tactics': return 'Reach the flag in the best possible number of moves, with no resets.';
    case 'cue': return 'Get 90% or more correct. Clear the level with 60%.';
    case 'tempo': return l >= 6 ? 'Finish with no wrong pads and keep the rhythm on almost every gap.' : 'Finish the pattern with no wrong pads.';
    case 'circuit': return 'Run the full circuit with no misses.';
    case 'reading': return 'Answer every question correctly. Clear the level with half.';
    case 'code': return 'Get 90% or more correct. Clear the level with 60%.';
    case 'breath': return 'Score 850 or more: breathing sync counts 40%, the focus set 60%. Clear with 500.';
  }
  return '';
}

SCREENS.play = (v, { w: wid, l }) => {
  const w = WORLDS.find(x => x.id === wid);
  if (!hasAccess(w)) return go('worlds');
  const tech = w.tech[l];
  v.appendChild(el(`<div class="stack">
    <div class="gamebar"><button class="iconbtn" id="quit" aria-label="Quit level">${ICON_X}</button><div class="gametitle"><b>${esc(w.name)} · Level ${l}</b><span>${phaseOf(l)} phase${tech ? ' · Technique' : ''}</span></div><button class="iconbtn" id="help" aria-label="How to play">${ICON_Q}</button></div>
    <div id="stage" class="stack"></div>
  </div>`));
  $('#quit', v).addEventListener('click', () => go('world', { id: wid }));
  $('#help', v).addEventListener('click', () => helpSheet(w, l));
  const stage = $('#stage', v);
  const run = () => {
    stage.innerHTML = '';
    const seed = 'lvl-' + wid + '-' + l + '-' + Date.now();
    GAMES[w.game](stage, { level: l, rng: rngFrom(seed), onDone: res => adsOn(w) ? adBreak(stage, () => results(res)) : results(res) });
  };
  const results = (res) => {
    const key = wid + '-' + l;
    const prevBest = S.best[key] || 0;
    if (res.stars > (S.stars[key] || 0)) S.stars[key] = res.stars;
    if (res.score > prevBest) S.best[key] = res.score;
    save();
    stage.innerHTML = '';
    const passed = res.stars > 0;
    const sheet = el(`<div class="sheet">
      <div class="res-stars">${[0, 1, 2].map(i => i < res.stars ? STAR : STAR.replace('<svg', '<svg class="off"')).join('')}</div>
      <div class="stack-s" style="text-align:center"><h2>${passed ? (res.stars === 3 ? 'Clean set.' : 'Level cleared.') : 'Not this time.'}</h2><p class="muted">${esc(res.detail)}</p></div>
      <div style="text-align:center"><span class="big-score">${res.score.toLocaleString('en-AU')}</span>${res.score > prevBest && prevBest ? '<p class="chip orange" style="margin-top:8px">New PB</p>' : ''}</div>
      <div class="stack-s">
        ${passed && l < 10 ? '<button class="btn sky block" id="next">Next level</button>' : ''}
        <button class="btn ${passed && l < 10 ? 'ghost' : 'sky'} block" id="again">${passed ? 'Replay for more stars' : 'Try again'}</button>
        <button class="btn ghost block" id="out">Back to ${esc(w.name)}</button>
      </div></div>`);
    stage.appendChild(sheet);
    if ($('#next', sheet)) $('#next', sheet).addEventListener('click', () => go('play', { w: wid, l: l + 1 }));
    $('#again', sheet).addEventListener('click', () => { if (tech) intro(); else run(); });
    if (res.stars < 3) sheet.querySelector('.stack-s').insertAdjacentHTML('beforeend', `<p class="note">For 3 stars: ${esc(starsRule(w.game, l))}</p>`);
    $('#out', sheet).addEventListener('click', () => go('world', { id: wid }));
  };
  const intro = () => {
    stage.innerHTML = '';
    const first = !(S.seen && S.seen[w.game]);

      ${tech ? `<div class="card tech-card stack"><span class="eyebrow" style="color:var(--orange)">Technique level</span><h2>${esc(tech.name)}</h2><p>${esc(tech.text)}</p><div id="extra"></div></div>` : ''}

function breathing(box) {

/* ---------- games ---------- */
const GAMES = {};
function timers() { const ids = []; let alive = true; onCleanup(() => { alive = false; ids.forEach(clearTimeout); }); return { later(fn, ms) { const id = setTimeout(() => { if (alive) fn(); }, ms); ids.push(id); return id; }, get alive() { return alive; } }; }

/* World 1: Plate Sudoku */
const PLATES = [
  { kg: '25', c: '#d9534a' }, { kg: '20', c: '#3f7fd6' }, { kg: '15', c: '#d8b63a', dark: 1 }, { kg: '10', c: '#46a86a' },
  { kg: '5', c: '#eceef0', dark: 1 }, { kg: '2.5', c: '#5d636b' }, { kg: '2', c: '#8f6bd1' }, { kg: '1.25', c: '#b5bcc3', dark: 1 }, { kg: '0.5', c: '#e2894b', dark: 1 }
];
GAMES.sudoku = (stage, { level, rng, onDone, size, blanks }) => {
  const n = size || (level <= 3 ? 4 : level <= 8 ? 6 : 9);
  const [br, bc] = n === 4 ? [2, 2] : n === 6 ? [2, 3] : [3, 3];
  const BLANKS = { 1: 6, 2: 8, 3: 10, 4: 14, 5: 16, 6: 18, 7: 20, 8: 22, 9: 40, 10: 48 };
  const nb = blanks || BLANKS[level];
  const pat = (r, c) => (bc * (r % br) + Math.floor(r / br) + c) % n;
  const rows = [], cols = [];
  shuffle([...Array(n / br).keys()], rng).forEach(b => shuffle([...Array(br).keys()], rng).forEach(k => rows.push(b * br + k)));
  shuffle([...Array(n / bc).keys()], rng).forEach(s => shuffle([...Array(bc).keys()], rng).forEach(k => cols.push(s * bc + k)));
  const sym = shuffle([...Array(n).keys()], rng);
  const grid = [], given = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { grid.push(sym[pat(rows[r], cols[c])]); given.push(true); }
  shuffle([...Array(n * n).keys()], rng).slice(0, nb).forEach(i => { grid[i] = null; given[i] = false; });
  const fs = n === 4 ? 17 : n === 6 ? 13 : 9.5;
  let sel = given.indexOf(false), mistakes = 0, t0 = Date.now(), finished = false;
  const T = timers();
  const root = el(`<div class="stack"><div class="hud"><span>Time <b id="tm">0:00</b></span><span>Clashes <b id="mk">0</b></span><span>Grid <b>${n}x${n}</b></span></div><div class="sgrid" id="g" style="grid-template-columns:repeat(${n},1fr)"></div><div class="palette" id="p"></div></div>`);
  stage.appendChild(root);
  const g = $('#g', root), p = $('#p', root);
  const plateHtml = (s, size) => `<span class="plate ${PLATES[s].dark ? 'dark' : ''}" style="background:${PLATES[s].c};font-size:${size}px">${PLATES[s].kg}</span>`;
  const conflicts = () => {
    const bad = new Set();
    for (let i = 0; i < n * n; i++) {
      if (grid[i] == null) continue;
      const r = Math.floor(i / n), c = i % n;
      for (let j = i + 1; j < n * n; j++) {
        if (grid[j] !== grid[i]) continue;
        const r2 = Math.floor(j / n), c2 = j % n;
        if (r === r2 || c === c2 || (Math.floor(r / br) === Math.floor(r2 / br) && Math.floor(c / bc) === Math.floor(c2 / bc))) { bad.add(i); bad.add(j); }
      }
    }
    return bad;
  };
  const draw = () => {
    const bad = conflicts();
    g.innerHTML = '';
    for (let i = 0; i < n * n; i++) {
      const r = Math.floor(i / n), c = i % n;
      const cls = ['scell', given[i] ? 'given' : '', i === sel ? 'sel' : '', bad.has(i) && !given[i] ? 'bad' : '', (c + 1) % bc === 0 && c < n - 1 ? 'br' : '', (r + 1) % br === 0 && r < n - 1 ? 'bb' : ''].join(' ');
      const b = el(`<button class="${cls}" aria-label="Row ${r + 1}, column ${c + 1}${grid[i] != null ? ', ' + PLATES[grid[i]].kg + ' kg' : ', empty'}">${grid[i] != null ? plateHtml(grid[i], fs) : ''}</button>`);
      if (!given[i]) b.addEventListener('click', () => { sel = i; draw(); });
      g.appendChild(b);
    }
    $('#mk', root).textContent = mistakes;
    if (!finished && grid.every(x => x != null) && bad.size === 0) done();
  };
  for (let s = 0; s < n; s++) {
    const b = el(`<button aria-label="${PLATES[s].kg} kg plate">${plateHtml(s, 14)}</button>`);
    b.addEventListener('click', () => {
      if (sel < 0 || given[sel] || finished) return;
      grid[sel] = s;
      if (conflicts().has(sel)) mistakes++;
      else { const nxt = grid.findIndex((x, i) => x == null && i > sel); const any = grid.findIndex(x => x == null); sel = nxt >= 0 ? nxt : any >= 0 ? any : sel; }
      draw();
    });
    p.appendChild(b);
  }
  const er = el('<button class="erase" aria-label="Clear cell">CLEAR</button>');
  er.addEventListener('click', () => { if (sel >= 0 && !given[sel]) { grid[sel] = null; draw(); } });
  p.appendChild(er);
  const tick = setInterval(() => { const s = Math.floor((Date.now() - t0) / 1000); $('#tm', root).textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }, 500);
  onCleanup(() => clearInterval(tick));
  function done() {
    finished = true; clearInterval(tick);
    const secs = Math.round((Date.now() - t0) / 1000);
    const per = n === 4 ? 8 : n === 6 ? 3 : 1;
    const par = n === 4 ? 45 : n === 6 ? 150 : 480;
    const score = clamp(Math.round(1000 - secs * per - mistakes * 80), 100, 1000);
    const st = mistakes === 0 && secs <= par ? 3 : mistakes <= 2 && secs <= par * 2 ? 2 : 1;
    T.later(() => onDone({ score, stars: st, detail: `Solved in ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')} with ${mistakes} clash${mistakes === 1 ? '' : 'es'}.` }), 450);
  }
  draw();
};

/* World 3: Turf Jigsaw */
function drawScene(ctx, S2, level) {
  const hues = [205, 25, 160, 260, 340, 190, 45, 120, 300, 210];
  const hue = hues[(level - 1) % hues.length];
  const sky = ctx.createLinearGradient(0, 0, 0, S2 * 0.65);
  sky.addColorStop(0, `hsl(${hue},35%,14%)`); sky.addColorStop(1, `hsl(${hue + 25},55%,42%)`);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, S2, S2);
  // sun
  ctx.fillStyle = 'hsla(35,90%,65%,.9)'; ctx.beginPath(); ctx.arc(S2 * (0.2 + (level % 5) * 0.15), S2 * 0.5, S2 * 0.09, 0, Math.PI * 2); ctx.fill();
  // shade structure
  ctx.strokeStyle = 'rgba(220,224,228,.55)'; ctx.lineWidth = S2 * 0.012;
  for (let k = 0; k < 4; k++) { ctx.beginPath(); ctx.arc(S2 * 0.5, S2 * 0.95, S2 * (0.42 + k * 0.035), Math.PI * 1.05, Math.PI * 1.95); ctx.stroke(); }
  // turf
  const ty = S2 * 0.64;
  for (let i = 0; i < 8; i++) { ctx.fillStyle = i % 2 ? '#2f6b40' : '#357a48'; ctx.fillRect(i * S2 / 8, ty, S2 / 8 + 1, S2 - ty); }
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fillRect(0, ty + S2 * 0.13, S2, S2 * 0.008);
  // USC mark
  if (MARK_IMG.complete && MARK_IMG.naturalWidth) { const mh = S2 * 0.3, mw = mh * MARK_IMG.naturalWidth / MARK_IMG.naturalHeight; ctx.drawImage(MARK_IMG, S2 * 0.93 - mw, S2 * 0.05, mw, mh); }
  // wordmark
  ctx.fillStyle = '#e4e6e9'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `900 ${S2 * 0.09}px Archivo, "Arial Black", sans-serif`; ctx.fillText('UNIVERSAL', S2 * 0.06, S2 * 0.2);
  ctx.font = `700 ${S2 * 0.034}px Figtree, Arial, sans-serif`; ctx.fillStyle = '#c9ccd0'; ctx.fillText('STRENGTH AND CONDITIONING', S2 * 0.065, S2 * 0.26);
  // barbell
  const by = S2 * 0.78;
  ctx.fillStyle = '#c7cbd0'; ctx.fillRect(S2 * 0.12, by - S2 * 0.008, S2 * 0.76, S2 * 0.016);
  const plateC = ['#d9534a', '#3f7fd6', '#d8b63a', '#46a86a'];
  [[0.18, 1], [0.22, -1]].forEach(() => {});
  for (let side = 0; side < 2; side++) for (let k = 0; k < 3; k++) {
    const x = side ? S2 * (0.76 - k * 0.04) : S2 * (0.2 + k * 0.04), h2 = S2 * (0.2 - k * 0.04);
    ctx.fillStyle = plateC[(level + k) % 4]; ctx.fillRect(x, by - h2 / 2, S2 * 0.035, h2);
  }
  // kettlebells
  for (let k = 0; k < 3; k++) {
    const kx = S2 * (0.14 + k * 0.08 + (level % 3) * 0.2), ky = S2 * 0.93;
    ctx.fillStyle = '#1c1f23'; ctx.beginPath(); ctx.arc(kx, ky, S2 * 0.03, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#1c1f23'; ctx.lineWidth = S2 * 0.01; ctx.beginPath(); ctx.arc(kx, ky - S2 * 0.035, S2 * 0.018, Math.PI, 0); ctx.stroke();
  }
  // level tag
  ctx.fillStyle = 'rgba(17,19,22,.75)'; ctx.fillRect(S2 * 0.68, S2 * 0.86, S2 * 0.28, S2 * 0.1);
  ctx.fillStyle = '#e2894b'; ctx.font = `900 ${S2 * 0.05}px Archivo, "Arial Black", sans-serif`; ctx.textAlign = 'center'; ctx.fillText('LEVEL ' + level, S2 * 0.82, S2 * 0.93);
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.font = `700 ${S2 * 0.028}px Figtree, Arial, sans-serif`; ctx.textAlign = 'left'; ctx.fillText('THE GAP · BRISBANE', S2 * 0.065, S2 * 0.6);
}
GAMES.jigsaw = (stage, { level, rng, onDone }) => {
  const n = level <= 3 ? 3 : level <= 6 ? 4 : level <= 9 ? 5 : 6;
  const helper = level <= 3, memory = level === 10;
  const T = timers();
  const build = () => {
    const cv = document.createElement('canvas'); cv.width = cv.height = 600;
    drawScene(cv.getContext('2d'), 600, level);
    const url = cv.toDataURL('image/jpeg', 0.86);
    let perm;
    do { perm = shuffle([...Array(n * n).keys()], rng); } while (perm.filter((p, i) => p === i).length > Math.floor(n / 2));
    const cycles = (() => { const seen = new Array(n * n).fill(false); let c = 0; for (let i = 0; i < n * n; i++) if (!seen[i]) { c++; let j = i; while (!seen[j]) { seen[j] = true; j = perm[j]; } } return c; })();
    const minSwaps = n * n - cycles;
    let sel = -1, moves = 0, t0 = Date.now(), finished = false;
    const root = el(`<div class="stack"><div class="hud"><span>Swaps <b id="mv">0</b></span><span>Best possible <b>${minSwaps}</b></span><span>Board <b>${n}x${n}</b></span></div><div class="jwrap"><div class="jgrid" id="g" style="grid-template-columns:repeat(${n},1fr);--img:url(${url})"></div></div><div class="jpeek" id="peek">${memory ? '<p class="note">Build it from memory. No peeking on this level.</p>' : `<img src="${url}" alt="The finished picture"><p class="note">${helper ? 'Tiles in the right spot get a green edge.' : 'This is the finished picture.'}</p>`}</div></div>`);
    stage.appendChild(root);
    const g = $('#g', root);
    const draw = () => {
      g.innerHTML = '';
      perm.forEach((piece, pos) => {
        const pr = Math.floor(piece / n), pc = piece % n;
        const b = el(`<button class="jtile ${pos === sel ? 'sel' : ''} ${helper && piece === pos ? 'ok' : ''}" aria-label="Tile ${pos + 1}" style="background-image:var(--img);background-size:${n * 100}% ${n * 100}%;background-position:${n > 1 ? pc / (n - 1) * 100 : 0}% ${n > 1 ? pr / (n - 1) * 100 : 0}%"></button>`);
        b.addEventListener('click', () => {
          if (finished) return;
          if (sel < 0) { sel = pos; }
          else if (sel === pos) { sel = -1; }
          else { [perm[sel], perm[pos]] = [perm[pos], perm[sel]]; sel = -1; moves++; $('#mv', root).textContent = moves; }
          draw();
          if (perm.every((p, i) => p === i)) finish();
        });
        g.appendChild(b);
      });
    };
    const finish = () => {
      finished = true;
      const secs = Math.round((Date.now() - t0) / 1000);
      const extra = moves - minSwaps;
      const score = clamp(Math.round(1000 - extra * 30 - secs * 2), 100, 1000);
      const st = moves <= minSwaps + 1 ? 3 : moves <= Math.ceil(minSwaps * 1.5) + 2 ? 2 : 1;
      T.later(() => onDone({ score, stars: st, detail: `${moves} swaps (best possible ${minSwaps}) in ${secs}s.` }), 600);
    };
    draw();
    if (memory) {
      const cover = el(`<div class="jcover"><img src="${url}" alt="The picture to memorise"><span class="chip orange" id="cd">Memorise · 6</span></div>`);
      $('.jwrap', root).appendChild(cover);
      let s = 6;
      const tick = () => { s--; if (s <= 0) { cover.remove(); t0 = Date.now(); } else { $('#cd', cover).textContent = 'Memorise · ' + s; T.later(tick, 1000); } };
      T.later(tick, 1000);
    }
  };
  const ready = [document.fonts && document.fonts.ready, MARK_IMG.decode ? MARK_IMG.decode().catch(() => {}) : null].filter(Boolean);
  Promise.all(ready).then(() => T.alive && build());
};

/* World 5: Call the Cue */
const INKS = [{ name: 'ORANGE', c: '#e2894b' }, { name: 'BLUE', c: '#5ab0e2' }, { name: 'GREEN', c: '#5cc48a' }, { name: 'WHITE', c: '#eceef0' }];
const ARROW = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${d === 'L' ? 180 : 0}deg)"><path d="M4 12h15M13 6l6 6-6 6"/></svg>`;
GAMES.cue = (stage, { level, rng, onDone, trials, mode }) => {
  const N = trials || 12 + level * 2;
  const limit = Math.max(900, 2600 - level * 160);
  const ruleFor = i => level <= 3 ? 'colour' : level === 4 ? 'arrow' : level <= 6 ? (i < N / 2 ? 'colour' : 'arrow') : (rng() < 0.5 ? 'colour' : 'arrow');
  const plan = [];
  for (let i = 0; i < N; i++) {
    const rule = ruleFor(i);
    if (rule === 'colour') { const ink = ri(rng, 4); let word = ink; if (rng() < 0.72) { word = (ink + 1 + ri(rng, 3)) % 4; } plan.push({ rule, ink, word }); }
    else { const dir = rng() < 0.5 ? 'L' : 'R'; const word = rng() < 0.7 ? (dir === 'L' ? 'RIGHT' : 'LEFT') : (dir === 'L' ? 'LEFT' : 'RIGHT'); plan.push({ rule, dir, word }); }
  }
  const usesColour = plan.some(p => p.rule === 'colour'), usesArrow = plan.some(p => p.rule === 'arrow');
  const T = timers();
  const root = el(`<div class="stack">
    <div class="hud"><span>Cue <b id="ci">0</b> / ${N}</span><span>Correct <b id="cc">0</b></span><span>Limit <b>${(limit / 1000).toFixed(1)}s</b></span></div>
    <div class="cuerule" id="rule">Get ready</div>
    <div class="cuestage" id="st"><span class="countdown" id="cd">3</span><div class="timer" id="tb" style="width:0"></div></div>
    ${usesColour ? `<div class="cuebtns" id="cb">${INKS.map((k, i) => `<button class="cuebtn" data-c="${i}" aria-label="${k.name.toLowerCase()}"><i style="background:${k.c}"></i>${k.name}</button>`).join('')}</div>` : ''}
    ${usesArrow ? `<div class="cuebtns arrows" id="ab"><button class="cuebtn" data-d="L" aria-label="Left">${ARROW('L')}LEFT</button><button class="cuebtn" data-d="R" aria-label="Right">${ARROW('R')}RIGHT</button></div>` : ''}
  </div>`);
  stage.appendChild(root);
  const st = $('#st', root), rule = $('#rule', root), tb = $('#tb', root);
  let i = -1, correct = 0, rts = [], shownAt = 0, live = false, timeoutId = null;
  const showRule = p => { rule.innerHTML = p.rule === 'colour' ? 'Tap the <em>ink colour</em>, not the word' : 'Follow the <em>arrow</em>, not the word'; };
  const next = () => {
    i++;
    if (i >= N) return end();
    const p = plan[i];
    $('#ci', root).textContent = i + 1;

function cwBuild(words, rng, target) {
  const order = shuffle(words.slice(), rng).sort((a, b) => b[0].length - a[0].length);

  const fits = (w, r, c, dir) => {
    const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0;

    if (Math.max(maxR, r2) - Math.min(minR, r) > 9 || Math.max(maxC, c2) - Math.min(minC, c) > 8) return -1;
    let cross = 0;
    for (let i = 0; i < w.length; i++) {
      const rr = r + dr * i, cc = c + dc * i, cell = get(rr, cc);
      if (cell) { if (cell.ch !== w[i] || cell[dir] != null) return -1; cross++; }
      else if (get(rr + dc, cc + dr) || get(rr - dc, cc - dr)) return -1;
    }
    return cross;
  };
  const put = (wd, r, c, dir) => {
    const idx = placed.length, dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0;
    placed.push({ ans: wd[0], clue: wd[1], r, c, dir });
    for (let i = 0; i < wd[0].length; i++) {
      const rr = r + dr * i, cc = c + dc * i, k = key(rr, cc);
      const cell = cells.get(k) || { ch: wd[0][i], A: null, D: null, r: rr, c: cc };
      cell[dir] = idx; cells.set(k, cell);
      minR = Math.min(minR, rr); maxR = Math.max(maxR, rr); minC = Math.min(minC, cc); maxC = Math.max(maxC, cc);
    }
  };
  if (order[0][0].length > 9) order.push(order.shift());
  put(order[0], 0, 0, 'A');

    if (placed.length >= target) break;
    const w = wd[0], cands = [];
    for (const cell of cells.values()) for (let i = 0; i < w.length; i++) {

      const dir = cell.A != null ? 'D' : 'A';

  placed.forEach(p => { p.num = starts.indexOf(p.r * 100 + p.c) + 1; });
  return { grid, words: placed, H, W };
}

  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => hp.addEventListener(ev, () => setP(false)));
  let breathingNow = false;
  const onKey = e => { if (!breathingNow || e.code !== 'Space') return; e.preventDefault(); setP(e.type === 'keydown'); };
  document.addEventListener('keydown', onKey); document.addEventListener('keyup', onKey);
  onCleanup(() => { document.removeEventListener('keydown', onKey); document.removeEventListener('keyup', onKey); });
  const breathe = () => {
    $('#go2', root).remove(); breathingNow = true;
    const steps = []; for (let c = 0; c < cycles; c++) pattern.forEach(p => steps.push(p));
    let t = 0, phase = null;
    steps.forEach(([kind, secs], i) => {
      T.later(() => {
        phase = kind;
        bl.textContent = label[kind] + ' · ' + secs + 's';
        bc.style.transition = `transform ${secs}s linear`;
        if (kind === 'in') bc.style.transform = 'scale(1)'; else if (kind === 'out') bc.style.transform = 'scale(.45)';
      }, t);
      t += secs * 1000;
    });
    const iv = setInterval(() => { if (!phase) return; samples++; if ((phase === 'out') !== pressed) match++; }, 100);
    onCleanup(() => clearInterval(iv));
    T.later(() => { clearInterval(iv); phase = null; breathingNow = false; setP(false); focus(); }, t);
  };
  const focus = () => {
    root.innerHTML = '';
    const raw = samples ? match / samples : 0, sync = clamp((raw - 0.5) / 0.5, 0, 1);
    const card = el(`<div class="stack"><div class="hud"><span>Part <b>2</b> / 2</span><span>Breathing sync <b>${Math.round(sync * 100)}%</b></span></div>
      <div class="card stack-s"><h2>Focus set</h2><p class="muted">Digits will appear one at a time. Tap for every digit except <b style="color:var(--orange)">3</b>. When you see a 3, do nothing.</p></div>
      <button class="btn sky block" id="go3">Start focus set</button></div>`);
    root.appendChild(card);
    $('#go3', card).addEventListener('click', () => run(sync));
  };
  const run = (sync) => {
    root.innerHTML = '';
    const digits = []; for (let i = 0; i < trials; i++) digits.push(rng() < 0.22 ? 3 : [1, 2, 4, 5, 6, 7, 8, 9][ri(rng, 8)]);
    const card = el(`<div class="stack"><div class="hud"><span>Digit <b id="di">0</b> / ${trials}</span><span>Correct <b id="dc">0</b></span></div>
      <div class="cuestage"><span class="cueword" id="dg" style="font-size:96px"></span></div>
      <button class="holdpad" id="tap">Tap</button></div>`);
    root.appendChild(card);
    let i = -1, tapped = false, ok = 0, goN = 0, goHit = 0, noN = 0, noHold = 0;
    const show = () => {
      if (i >= 0) {
        const isThree = digits[i] === 3, right = isThree ? !tapped : tapped;
        if (isThree) { noN++; if (right) noHold++; } else { goN++; if (right) goHit++; }
        if (right) ok++; $('#dc', card).textContent = ok;
      }
      i++; tapped = false;
      if (i >= trials) { const acc = 0.5 * (goN ? goHit / goN : 1) + 0.5 * (noN ? noHold / noN : 1); return finish(sync, acc); }
      $('#di', card).textContent = i + 1;
      const dg = $('#dg', card); dg.textContent = digits[i]; dg.style.opacity = 1;
      T.later(() => { dg.style.opacity = 0.15; }, gap * 0.7);
      T.later(show, gap);
    };
    const tapBtn = $('#tap', card);
    const doTap = () => { if (i >= 0 && i < trials) { tapped = true; tapBtn.classList.add('down'); T.later(() => tapBtn.classList.remove('down'), 120); } };
    tapBtn.addEventListener('pointerdown', e => { e.preventDefault(); doTap(); });
    tapBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!e.repeat) doTap(); } });
    T.later(() => tapBtn.focus(), 50);
    T.later(show, 600);
  };
  const finish = (sync, acc) => {
    const score = Math.round(sync * 400 + acc * 600);
    const st = score >= 850 ? 3 : score >= 700 ? 2 : score >= 500 ? 1 : 0;
    onDone({ score, stars: st, detail: `Breathing sync ${Math.round(sync * 100)}%, focus set ${Math.round(acc * 100)}% (taps on digits and holds on 3s count equally).${st === 0 ? ' Clear the level with 500 or more.' : ''}` });
  };
  $('#go2', root).addEventListener('click', breathe);
};

/* ---------- Ad break (guests on the free-with-ads route) ---------- */
function adBreak(stage, then) {
  stage.innerHTML = '';
  const T = timers();
  const card = el(`<div class="sheet"><span class="eyebrow">Advertisement</span><div class="adbox"><span>Sponsor ad space</span><small>Shown to guests on levels 41 to 100</small></div><p class="note">USC members never see ads.</p><button class="btn sky block" id="noads">Remove ads · ${PRICE}</button><button class="btn ghost block" id="skip" disabled>Skip in 5</button></div>`);
  stage.appendChild(card);
  let s = 5;
  const tick = () => { s--; const b = $('#skip', card); if (s <= 0) { b.disabled = false; b.textContent = 'Continue'; } else { b.textContent = 'Skip in ' + s; T.later(tick, 1000); } };
  T.later(tick, 1000);
  $('#skip', card).addEventListener('click', then);
  $('#noads', card).addEventListener('click', () => { S.pack = true; S.ads = false; save(); toast('Ads removed (demo)'); then(); });
}

/* ---------- boot ---------- */
go(S.user ? 'home' : 'login');
</script>
